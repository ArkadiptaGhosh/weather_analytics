name: CI

on:
  pull_request:

  push:
    branches:
      - main

jobs:
  # Validate the project by running tests, building the package,
  # and checking the Databricks Asset Bundle configuration...
  validate:
    # if: false  # Uncomment to disable this job
    runs-on: ubuntu-latest
    environment: prod

    # Environment variables for Databricks API authentication.
    # These secrets must be configured in the GitHub repository settings.
    env:
      # Databricks OAuth service principal application ID for API authentication.
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      # Databricks OAuth service principal application secret for API authentication.
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

    steps:
      # Check out the repository so the runner has access to the project source code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Python 3.11 for a consistent CI environment.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install Poetry to manage project dependencies and build the Python package.
      - name: Install Poetry
        run: pip install poetry

      # Install the project dependencies using the locked versions from poetry.lock.
      - name: Install dependencies
        run: poetry install

      # Install pytest so the test runner is available in the CI environment.
      - name: Install pytest
        run: pip install pytest

      # # Run the automated test suite to verify that code changes have not broken existing functionality.
      # - name: Run pytest
      #   run: poetry run pytest

      # Build the Python wheel that will be packaged and deployed to Databricks.
      - name: Build package
        run: poetry build

      # Install the Databricks CLI so CI can validate the Databricks Asset Bundle.
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      
      # Verify that the Databricks CLI can authenticate using the GitHub environment credentials.
      # The actual client secret is never printed to the workflow log.
      - name: Verify Databricks authentication
        run: databricks auth describe

      # Validate the Databricks Asset Bundle configuration before deployment...
      - name: Validate Databricks Bundle
        run: databricks bundle validate -t dev


      # Deploy the Databricks Asset Bundle to the development target...
      - name: Deploy Databricks Bundle
        run: databricks bundle deploy -t dev