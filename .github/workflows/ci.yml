name: CI

on:
  pull_request:

  push:
    branches:
      - dev
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    # GitHub Environment used for Databricks authentication secrets.
    environment: prod

    env:
      # Databricks OAuth service principal application ID.
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}

      # Databricks OAuth service principal application secret.
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

    steps:
      # Check out the repository.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Python 3.11.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install Poetry.
      - name: Install Poetry
        run: pip install poetry

      # Install project dependencies.
      - name: Install dependencies
        run: poetry install

      # Install pytest.
      - name: Install pytest
        run: pip install pytest

      # Run automated tests.
      # Enable this when the project has tests ready.
      # - name: Run pytest
      #   run: poetry run pytest

      # Build the Python wheel.
      - name: Build package
        run: poetry build

      # Install Databricks CLI.
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      # Verify Databricks authentication.
      - name: Verify Databricks authentication
        run: databricks auth describe

      # Validate the Databricks Asset Bundle.
      - name: Validate Databricks Bundle
        run: databricks bundle validate -t dev

      # Apply Unity Catalog permissions.
      # Currently disabled because UC permissions are already configured.
      # This is kept as a learning reference for future access-management CI/CD.
      #
      # - name: Apply Unity Catalog permissions
      #   run: |
      #     databricks grants update catalog weather_dev \
      #       --json @permissions/uc_grants.json

      # Deploy to DEV only when code is pushed to the dev branch.
      - name: Deploy Databricks Bundle DEV
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        run: databricks bundle deploy -t dev

      # Deploy to PROD only when code is pushed to the main branch.
      - name: Deploy Databricks Bundle PROD
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: databricks bundle deploy -t prod