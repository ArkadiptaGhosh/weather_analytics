resources:
  jobs:
    weather_analytics_job:
      name: wf_weather_analytics_job_prod

      schedule:
        quartz_cron_expression: "0 0 0 * * ?"
        timezone_id: "Asia/Kolkata"
        pause_status: "UNPAUSED"

      tasks:
        - task_key: bronze_ingestion

          python_wheel_task:
            package_name: weather_analytics
            entry_point: weather-bronze
            named_parameters:
              layer: bronze
              bronze_catalogue: weather_analytics
              bronze_schema : bronze
              bronze_table : weather_raw


          environment_key: weather_environment

        - task_key: silver_job

          depends_on:
            - task_key: bronze_ingestion

          python_wheel_task:
            package_name: weather_analytics
            entry_point: weather-silver
            named_parameters:
              layer: silver
              bronze_catalogue: weather_analytics
              bronze_schema : bronze
              bronze_table : weather_raw
              silver_catalogue: weather_analytics
              silver_schema : silver
              silver_table : weather_curated

          environment_key: weather_environment

      environments:
        - environment_key: weather_environment
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/weather_analytics-0.1.2-py3-none-any.whl