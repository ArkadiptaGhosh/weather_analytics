# 1. This block automatically builds your Poetry wheel file with the right name
artifacts:
  default:
    type: whl
    build: poetry build
    path: ../../
    dynamic_version: true

# 2. Define your dynamic values at the global bundle variable level
variables:
  global_run_id:
    default: "{{job.run_id}}"
  global_execution_date:
    default: "{{job.start_time.iso_date}}"
  email_id:
    default: "arkadiptaghosh99@gmail.com"

# Global permissions applied to ALL resources in this bundle
permissions:
  - user_name: arkadiptaghosh81@gmail.com
    level: CAN_MANAGE
  - user_name: rajnil54.guha@gmail.com
    level: CAN_VIEW

resources:
  jobs:
    weather_analytics_job:
      name: wf_weather_analytics_job_prod
      email_notifications:
        on_success: 
            - arkadiptaghosh99@gmail.com
        on_failure: 
            - arkadiptaghosh99@gmail.com

      parameters:
        - name: email
          default: ${var.email_id}
        - name: run_id
          default: ${var.global_run_id}
        - name: execution_date
          default: ${var.global_execution_date}

      schedule:
        quartz_cron_expression: "0 0 0 * * ?"
        timezone_id: "Asia/Kolkata"
        pause_status: "UNPAUSED"

      tasks:
        - task_key: bronze_ingestion
          python_wheel_task:
            package_name: weather_analytics
            entry_point: weather-bronze
            named_parameters:
              layer: bronze
              bronze_catalogue: weather_analytics
              bronze_schema : bronze
              bronze_table : weather_raw
          environment_key: weather_environment

        - task_key: silver_job
          depends_on:
            - task_key: bronze_ingestion
          python_wheel_task:
            package_name: weather_analytics
            entry_point: weather-silver
            named_parameters:
              layer: silver
              bronze_catalogue: weather_analytics
              bronze_schema : bronze
              bronze_table : weather_raw
              silver_catalogue: weather_analytics
              silver_schema : silver
              silver_table : weather_curated
          environment_key: weather_environment

      environments:
        - environment_key: weather_environment
          spec:
            environment_version: "4"
            dependencies:
              # FIXED: Pointing directly to the built wheel location. 
              # Databricks dynamically matches this wildcard wheel file at deployment time!
              - ../../dist/weather_analytics-*.whl
