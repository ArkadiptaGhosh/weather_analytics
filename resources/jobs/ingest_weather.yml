resources:
  jobs:
    weather_analytics_job:
      name: wf_weather_analytics_job_prod

      schedule:
        quartz_cron_expression: "0 0 0,12 * * ?"
        timezone_id: "Asia/Kolkata"
        pause_status: "UNPAUSED"

      tasks:
        - task_key: bronze_ingestion

          python_wheel_task:
            package_name: weather_analytics
            entry_point: weather-bronze

          environment_key: weather_environment

        - task_key: silver_processing

          depends_on:
            - task_key: bronze_ingestion

          python_wheel_task:
            package_name: weather_analytics
            entry_point: weather-silver

          environment_key: weather_environment

      environments:
        - environment_key: weather_environment
          spec:
            environment_version: "4"
            dependencies:
              - ../../dist/weather_analytics-0.1.1-py3-none-any.whl