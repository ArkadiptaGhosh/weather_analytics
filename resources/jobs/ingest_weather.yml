resources:
  jobs:
    weather_analytics_job:
      name: wf_weather_analytics_job_prod

      parameters:
        - name: run_id
          default: ${var.global_run_id}
        - name: execution_date
          default: ${var.global_execution_date}


      email_notifications:
        on_success: 
            - ${var.email_id}
        on_failure: 
            - ${var.email_id}

      schedule:
        quartz_cron_expression: "0 0 0 * * ?"
        timezone_id: "Asia/Kolkata"
        pause_status: "UNPAUSED"

      tasks:
        - task_key: bronze_ingestion
          python_wheel_task:
            package_name: weather_analytics
            entry_point: EntryPoint
            named_parameters:
              layer: bronze
              bronze_catalogue: ${var.catalog_name}
              bronze_schema : ${var.bronze_schema}
              bronze_table : ${var.bronze_table}
            
          environment_key: weather_environment

        - task_key: silver_job
          depends_on:
            - task_key: bronze_ingestion
          python_wheel_task:
            package_name: weather_analytics
            entry_point: EntryPoint
            named_parameters:
              layer: silver
              bronze_catalogue: ${var.catalog_name}
              bronze_schema : ${var.bronze_schema}
              bronze_table : ${var.bronze_table}
              silver_catalogue: ${var.catalog_name}
              silver_schema : ${var.silver_schema}
              silver_table : ${var.silver_table}

          environment_key: weather_environment

        - task_key: gold_aggregation
          depends_on:
            - task_key: silver_job
          python_wheel_task:
            package_name: weather_analytics
            entry_point: EntryPoint
            named_parameters:
              layer: gold
              silver_catalogue: ${var.catalog_name}
              silver_schema : ${var.silver_schema}
              silver_table : ${var.silver_table}
              gold_catalogue: ${var.catalog_name}
              gold_schema : ${var.gold_schema}
              gold_table : ${var.gold_table}

          environment_key: weather_environment

      environments:
        - environment_key: weather_environment
          spec:
            environment_version: "4"
            dependencies:
              # FIXED: Pointing directly to the built wheel location. 
              # Databricks dynamically matches this wildcard wheel file at deployment time!
              - ../../dist/weather_analytics-*.whl
