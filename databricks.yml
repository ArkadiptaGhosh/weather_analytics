bundle:
  name: weather_analytics

include:
  - resources/jobs/*.yml

workspace:
  host: https://dbc-b1a7c3fe-a880.cloud.databricks.com

targets:
  dev:
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

    resources:
      jobs:
        weather_analytics_job:
          name: wf_weather_analytics_job_dev
          schedule:
            quartz_cron_expression: "0 0 0,12 * * ?"
            timezone_id: "Asia/Kolkata"
            pause_status: "PAUSED"

  prod:
    mode: production
    default: true

    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}