[project]
name = "weather_analytics"
version = "0.1.13"
description = "My DBX weather_analytics project"
authors = [
    {name = "ArkadiptaGhosh",email = "arkadiptaghosh81@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests (>=2.31.0,<3.0.0)",
]

[project.scripts]
EntryPoint = "weather_analytics.entrypoint:main"

[tool.poetry]
packages = [{include = "weather_analytics", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
